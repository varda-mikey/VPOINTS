<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-POINTS 2.0</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#17211b;--muted:#6c766f;--line:#e5e9e6;--green:#176b45;--soft:#e9f5ee;--warn:#9a6417}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:850;font-size:22px}.tag{font-size:12px;color:var(--muted)}.icon{border:0;background:var(--card);width:44px;height:44px;border-radius:15px}.hello h1{font-size:25px;margin:0 0 5px}.hello p{margin:0;color:var(--muted);font-size:14px}.health{margin:20px 0;padding:18px;background:linear-gradient(135deg,#163d2c,#176b45);color:white;border-radius:24px}.health small{opacity:.78}.healthrow{display:flex;align-items:end;justify-content:space-between;margin-top:8px}.big{font-size:38px;font-weight:850}.up{font-size:13px;background:#ffffff20;padding:7px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px}.stat b{font-size:23px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section b{font-size:16px}.link{border:0;background:none;color:var(--green);font-weight:750}.coverage{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.bar{height:9px;background:#edf0ee;border-radius:20px;overflow:hidden;margin:12px 0 8px}.bar i{display:block;height:100%;width:88%;background:var(--green);border-radius:20px}.coverage p{margin:0;color:var(--muted);font-size:13px}.people{display:grid;grid-template-columns:1fr 1fr;gap:11px}.person{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:10px;text-align:left}.photo{aspect-ratio:1/1;border-radius:16px;background:linear-gradient(145deg,#d9e2dc,#eef2ef);display:grid;place-items:center;font-size:36px;margin-bottom:10px}.person strong{display:block;font-size:14px}.person small{color:var(--muted);display:block;margin-top:2px}.score{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px}.score b{color:var(--green)}.actions{display:grid;gap:8px}.action{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--card);border-radius:17px;padding:13px 14px;text-align:left}.action b{display:block}.action small{color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(12px);display:flex;justify-content:center}.navin{width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px max(8px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;padding:8px 2px;color:var(--muted);font-size:11px}.nav button.active{color:var(--green);font-weight:800}.nav em{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.pill{display:inline-block;margin-top:8px;background:var(--soft);color:var(--green);padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}@media(max-width:350px){.people{grid-template-columns:1fr}.big{font-size:32px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="brand">V-POINTS!</div><div class="tag">Recognition • Growth • Accountability</div></div><button class="icon" aria-label="Notifications">🔔</button></header>
<section class="hello"><h1>Good day, Leader 👋</h1><p>REGIONAL • SAMPLE REGION</p></section>
<section class="health"><small>TEAM HEALTH</small><div class="healthrow"><div><div class="big">94%</div><small>in good standing</small></div><div class="up">↑ 3% this month</div></div></section>
<div class="grid"><div class="stat"><b>48</b><span>People</span></div><div class="stat"><b>5</b><span>Needs your action</span></div></div>
<div class="section"><b>👥 Team Coverage</b><button class="link">View</button></div>
<section class="coverage"><strong>42 of 48 reviewed</strong><div class="bar"><i></i></div><p>88% coverage • 🔥 14-day activity streak</p></section>
<div class="section"><b>🏆 Your People</b><button class="link">See all</button></div>
<section class="people">
<button class="person"><div class="photo">👤</div><strong>Juan Dela Cruz</strong><small>Kitchen Cook</small><div class="score"><b>⭐ 126</b><span>Very Good</span></div><span class="pill">Reviewed</span></button>
<button class="person"><div class="photo">👤</div><strong>Maria Santos</strong><small>Cashier</small><div class="score"><b>⭐ 118</b><span>Good</span></div><span class="pill">Reviewed</span></button>
<button class="person"><div class="photo">👤</div><strong>Carlo Reyes</strong><small>Server</small><div class="score"><b>⭐ 103</b><span>Good</span></div></button>
<button class="person"><div class="photo">👤</div><strong>Ana Cruz</strong><small>Front Leader</small><div class="score"><b>⭐ 94</b><span>Monitoring</span></div></button>
</section>
<div class="section"><b>Needs You</b></div>
<section class="actions"><button class="action"><span><b>⭐ Merit approvals</b><small>3 waiting for review</small></span><span>›</span></button><button class="action"><span><b>⚖ Cases for review</b><small>2 need action</small></span><span>›</span></button><button class="action"><span><b>👀 Staff to check</b><small>6 not reviewed this period</small></span><span>›</span></button></section>
</main>
<nav class="nav"><div class="navin"><button class="active"><em>⌂</em>Home</button><button><em>👥</em>People</button><button><em>⚖</em>Cases</button><button><em>•••</em>More</button></div></nav>
</body></html>
